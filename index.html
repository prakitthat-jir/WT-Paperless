<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WT Paperless — คลังสินค้าและจัดส่ง</title>
<meta name="description" content="แบบฟอร์มตรวจสอบของแผนกคลังสินค้าและจัดส่ง แบบไร้กระดาษ — INTER GROUP PACKAGING">
<link rel="manifest" href="WT-Paperless.webmanifest">
<meta name="theme-color" content="#1aa64b">
<link rel="icon" type="image/png" sizes="32x32" href="WT-Paperless-Icons/favicon-32.png">
<link rel="apple-touch-icon" href="WT-Paperless-Icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WT Paperless">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS — ธีมเขียว (ชุดเดียวกับระบบจัดส่งแผ่น)
   ═══════════════════════════════════════════════════════════ */
:root{
  --p:#1aa64b; --pd:#137a39; --pl:#22c55e; --s:#ff6a13;
  --fa:#1aa64b; --fa2:#22c55e; --fb:#137a39; --on-fill:#fff;
  --ok:#10b981; --er:#ef4444; --wa:#f59e0b; --ng:#ef4444;
  --bg:#eef2f6; --bg-grad-a:#f4f7fa; --bg2:#f1f5f9; --bg3:#f6f9fc;
  --card:#fff; --inp:#fff; --ovl:rgba(255,255,255,.86);
  --tx:#0f172a; --tx2:#334155; --mu:#64748b; --mu2:#94a3b8;
  --bd:#e6ecf2; --bd2:#cbd5e1; --ac:#eafaf0; --hov:#f1f8f4;
  --t-g:#d1fae5; --t-gT:#065f46; --t-r:#fee2e2; --t-rT:#991b1b;
  --t-o:#fef3c7; --t-oT:#92400e; --t-y:#f1f5f9; --t-yT:#475569;
  --r:14px; --rs:10px; --rl:18px;
  --sh-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
  --sh-md:0 6px 16px -4px rgba(15,23,42,.10),0 2px 6px -2px rgba(15,23,42,.06);
  --sh-lg:0 18px 40px -12px rgba(15,23,42,.22);
  --nav-w:214px; --hdr-h:62px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Prompt','Leelawadee UI','Noto Sans Thai',Tahoma,'Segoe UI',sans-serif;
  font-size:15.5px; line-height:1.5; color:var(--tx);
  background:linear-gradient(180deg,var(--bg-grad-a) 0%,var(--bg) 100%);
  background-attachment:fixed; min-height:100vh;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; letter-spacing:.1px;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
::selection{background:rgba(26,166,75,.22)}
*{scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:9px;border:3px solid transparent;background-clip:content-box}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);background-clip:content-box}
.hide{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ───────── Header ───────── */
.hdr{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:13px;padding:8px 18px;max-width:100%;
  background:var(--ovl);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--bd);box-shadow:0 2px 16px -6px rgba(15,23,42,.16)
}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--fa),var(--fa2),var(--s))}
.logo-img{height:42px;width:auto;display:block;flex:none}
.hdr .htxt{flex:1;min-width:0}
.hdr h1{margin:0;font-size:1.06rem;font-weight:800;color:var(--pd);letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr small{display:block;font-size:.72rem;color:var(--mu);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hact{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.iconbtn{background:var(--card);border:1px solid var(--bd);color:var(--tx2);border-radius:var(--rs);
  padding:8px 13px;cursor:pointer;font-weight:600;font-size:.86rem;transition:.16s}
.iconbtn:hover{border-color:var(--p);background:var(--ac);color:var(--pd)}
.statchip{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:6px 14px;
  font-size:.76rem;font-weight:700;white-space:nowrap;max-width:38vw;overflow:hidden;text-overflow:ellipsis;
  border:0;font-family:inherit}
.statchip.on{background:linear-gradient(135deg,var(--fa2),var(--fa));color:#fff;box-shadow:0 3px 10px rgba(26,166,75,.32)}
.statchip.off{background:var(--bg2);color:var(--mu);border:1px solid var(--bd)}
.statchip.pend{background:linear-gradient(135deg,#ff8a3d,var(--s));color:#fff;cursor:pointer}

/* ───────── Layout + Sidebar ───────── */
.layout{display:flex;align-items:flex-start}
.sidebar{width:var(--nav-w);flex-shrink:0;padding:12px 0;position:sticky;top:var(--hdr-h);
  align-self:flex-start;height:calc(100vh - var(--hdr-h));overflow-y:auto;
  background:linear-gradient(180deg,var(--fa) 0%,var(--fb) 100%);box-shadow:inset -1px 0 0 rgba(0,0,0,.08)}
.navsec{margin:12px 16px 5px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.62);
  text-transform:uppercase;letter-spacing:.7px}
.nav{margin:3px 10px;padding:10px 13px;border-radius:11px;cursor:pointer;font-weight:600;font-size:.85rem;
  color:rgba(255,255,255,.88);display:flex;align-items:center;gap:9px;transition:.18s;border:0;
  background:transparent;width:calc(100% - 20px);text-align:left;line-height:1.3}
.nav .ic{font-size:1.05rem;flex:none}
.nav .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font-size:.7rem;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 8px;font-weight:700;flex:none}
.nav.on{color:var(--pd);background:var(--card);font-weight:800;box-shadow:0 6px 16px -4px rgba(0,0,0,.28)}
.nav.on .n{background:var(--ac);color:var(--pd)}
.nav:hover:not(.on){color:#fff;background:rgba(255,255,255,.16);transform:translateX(3px)}
.cnt{flex:1;min-width:0;width:100%;padding:16px 22px 96px;max-width:1180px;animation:fadeUp .3s ease both}
@media(min-width:821px){ .cnt{margin-inline:auto} }

/* ───────── เมนูข้าง / หัวเรื่อง — ปรับให้อ่านชื่อฟอร์มได้เต็ม ───────── */
:root{--nav-w:230px}
.sidebar{display:flex;flex-direction:column;padding:14px 0 16px}
.navsec{display:flex;align-items:center;gap:9px}
.navsec::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.22)}
.nav{align-items:flex-start}
.nav .tx{white-space:normal;line-height:1.3;text-overflow:clip}
.nav .ic,.nav .n{margin-top:1px}
.side-foot{margin:auto 12px 0;padding:13px 4px 0;border-top:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.6);font-size:.67rem;line-height:1.55}
.side-foot b{display:block;color:rgba(255,255,255,.9);font-size:.73rem;font-weight:700;letter-spacing:.3px}
@media(min-width:701px){ .hdr .htxt{border-left:1px solid var(--bd);padding-left:14px} }

/* ───────── หน้าแรก — แถบสรุป ───────── */
.dash{margin-bottom:4px}
.dash-head{position:relative;overflow:hidden;border-radius:var(--rl);padding:20px 24px;color:#fff;
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--fa) 0%,var(--fb) 78%);
  box-shadow:0 14px 32px -18px rgba(19,122,57,.9)}
.dash-head::after{content:"";position:absolute;right:-70px;top:-110px;width:290px;height:290px;border-radius:50%;
  background:radial-gradient(circle at 32% 32%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);pointer-events:none}
.dh-txt{min-width:0;position:relative;z-index:1}
.dh-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.9px;color:rgba(255,255,255,.76)}
.dash-head h1{margin:6px 0 5px;font-size:1.42rem;font-weight:800;letter-spacing:.2px;line-height:1.3}
.dash-head p{margin:0;font-size:.87rem;color:rgba(255,255,255,.9)}
.dh-date{position:relative;z-index:1;flex:none;text-align:right;padding:10px 16px;border-radius:14px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24)}
.dh-date span{display:block;font-size:.71rem;font-weight:600;color:rgba(255,255,255,.82)}
.dh-date b{font-size:1.02rem;font-weight:700}

.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));margin-top:13px}
.kpi{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--card);
  border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-sm);text-align:left;
  font-family:inherit;color:inherit;width:100%}
.kpi .k-ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--ac),#dff3e6);color:var(--pd)}
.kpi b{display:block;font-size:1.3rem;font-weight:800;line-height:1.2}
.kpi .k-lab{display:block;font-size:.74rem;font-weight:700;color:var(--mu)}
.kpi .k-sub{display:block;font-size:.71rem;font-weight:700;color:var(--pd);margin-top:2px}
.kpi.warn{border-color:#fbd8a6;background:linear-gradient(135deg,#fffaf2,#fff);cursor:pointer}
.kpi.warn .k-ic{background:linear-gradient(135deg,#ffe8ce,#ffd7a8);color:#9a4a06}
.kpi.warn .k-sub{color:var(--s)}
.kpi.warn:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}

/* ───────── หน้าแรก — หัวข้อกลุ่ม + การ์ดแบบฟอร์ม ───────── */
.sect-head{display:flex;align-items:center;gap:12px;margin:26px 2px 12px}
.sect-head .t{flex:none;font-size:.74rem;font-weight:800;color:var(--mu);letter-spacing:.7px}
.sect-head .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--bd),rgba(230,236,242,0))}
.sect-head .r{flex:none;font-size:.72rem;font-weight:700;color:var(--mu2)}

.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(274px,1fr))}
.fcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;
  padding:15px 16px 13px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh-sm);cursor:pointer;font-family:inherit;color:inherit;
  transition:box-shadow .25s,transform .2s,border-color .2s}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:0;transition:opacity .2s;
  background:linear-gradient(180deg,var(--fa2),var(--fb))}
.fcard:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:#cfe8d8}
.fcard:hover::before{opacity:1}
.fc-top{display:flex;align-items:center;gap:10px}
.fc-top .ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg,var(--ac),#dff3e6);color:var(--pd)}
.fc-code{margin-left:auto;white-space:nowrap;font-size:.67rem;font-weight:800;letter-spacing:.4px;color:var(--mu);
  background:var(--bg2);border:1px solid var(--bd);border-radius:999px;padding:4px 10px}
.fcard h3{margin:0;font-size:.98rem;font-weight:700;line-height:1.42;min-height:2.84em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fc-meta{font-size:.75rem;font-weight:600;color:var(--mu)}
.fc-foot{margin-top:auto;padding-top:10px;border-top:1px dashed var(--bd);
  display:flex;align-items:center;gap:8px}
.fc-n{font-size:1.05rem;font-weight:800;color:var(--pd);line-height:1}
.fc-n small{margin-left:3px;font-size:.71rem;font-weight:700;color:var(--mu)}
.fc-new{font-size:.69rem;font-weight:800;color:var(--t-gT);background:var(--t-g);border-radius:999px;padding:3px 9px}
.fcard .go{margin-left:auto;font-size:1.25rem;line-height:1;color:var(--mu2);transition:.2s}
.fcard:hover .go{color:var(--pd);transform:translateX(3px)}

/* ───────── หน้าแรก — การ์ดข้อมูลหลัก ───────── */
.mgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.mcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 16px;
  background:linear-gradient(180deg,#fff,var(--bg3));border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--sh-sm);cursor:pointer;font-family:inherit;color:inherit;
  transition:box-shadow .25s,transform .2s,border-color .2s}
.mcard:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:#cfe8d8}
.mcard .ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(135deg,var(--ac),#dff3e6);color:var(--pd)}
.mcard .mtx{flex:1;min-width:0}
.mcard h3{margin:0 0 2px;font-size:.96rem;font-weight:700;line-height:1.35}
.mcard .code{font-size:.72rem;font-weight:600;color:var(--mu)}
.mcard .mmeta{margin-top:4px;font-size:.73rem;font-weight:600;color:var(--pd)}
.mcard .cnt3{flex:none;text-align:right}
.mcard .cnt3 b{display:block;font-size:1.12rem;font-weight:800;color:var(--pd);line-height:1.2}
.mcard .cnt3 span{display:block;font-size:.7rem;font-weight:700;color:var(--mu);white-space:nowrap}

/* ───────── Buttons ───────── */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:var(--rs);
  padding:9px 15px;cursor:pointer;font-size:.88rem;font-weight:700;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(15,23,42,.06);
  transition:transform .16s,box-shadow .16s,background .16s,border-color .16s}
.btn:hover{transform:translateY(-1px);border-color:var(--p);background:var(--ac);color:var(--pd)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--fa),var(--fb));border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(26,166,75,.32)}
.btn.primary:hover{box-shadow:0 6px 16px rgba(26,166,75,.42);background:linear-gradient(135deg,var(--fa2),var(--fa));color:#fff}
.btn.danger{color:var(--er);border-color:#f6cccc;background:#fff}
.btn.danger:hover{background:#fef2f2;border-color:var(--er);color:var(--er)}
.btn.sm{padding:5px 11px;font-size:.78rem;border-radius:8px;box-shadow:none}
.spacer{flex:1}

/* ───────── Inputs ───────── */
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{
  width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--inp);
  color:var(--tx);font-size:.92rem;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(26,166,75,.16)}
textarea{min-height:74px;resize:vertical}

/* ───────── Tables ───────── */
.tablewrap{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:auto;
  box-shadow:var(--sh-sm);max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--bg2);font-size:.75rem;font-weight:800;color:var(--mu);position:sticky;top:0;z-index:2;
  text-transform:uppercase;letter-spacing:.4px}
tbody tr:hover{background:var(--hov)}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:active{background:var(--ac)}
tbody tr.rowlink td:last-child{white-space:nowrap}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.multi td,.multi th{white-space:nowrap}
.multi td:first-child{white-space:normal;min-width:170px}
.empty{padding:44px 16px;text-align:center;color:var(--mu);font-size:.92rem}

/* ───────── Pills / chips ───────── */
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:800}
.pill.ok{background:var(--t-g);color:var(--t-gT)}
.pill.ng{background:var(--t-r);color:var(--t-rT)}
.pill.warn{background:var(--t-o);color:var(--t-oT)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;
  font-size:.84rem;font-weight:600;transition:.15s;font-family:inherit;color:var(--tx2)}
.chip:hover{border-color:var(--p);color:var(--pd);background:var(--ac)}
.chip.on{background:linear-gradient(135deg,var(--fa),var(--fb));color:#fff;border-color:transparent;font-weight:700}

/* ───────── Panels / form ───────── */
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh-sm);
  margin-bottom:14px;overflow:hidden}
.panel > h2{margin:0;padding:13px 16px;font-size:.8rem;font-weight:800;color:var(--pd);
  text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(180deg,#fbfdfc,var(--bg3));
  border-bottom:1px solid var(--bd)}
.panel .body{padding:15px 16px}
.fields{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
label.f{display:block}
label.f > span{display:block;font-size:.76rem;font-weight:700;color:var(--mu);margin-bottom:5px}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--bd)}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:600;font-size:1rem;line-height:1.4}
.item .txt small{display:block;color:var(--mu);font-size:.82rem;margin-top:3px;line-height:1.4}
.grp{margin:16px 0 4px;font-weight:800;color:var(--pd);font-size:.95rem;
  border-left:4px solid var(--p);padding-left:10px}
.choices{display:flex;gap:7px;flex:none}
.choice{border:1.5px solid var(--bd);background:var(--card);border-radius:10px;min-width:58px;padding:10px 12px;
  cursor:pointer;font-weight:800;font-size:.92rem;text-align:center;font-family:inherit;color:var(--tx2);transition:.15s}
.choice:hover{border-color:var(--p);color:var(--pd)}
.choice.on[data-good="1"]{background:linear-gradient(135deg,#34d399,#059669);border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(16,185,129,.3)}
.choice.on[data-good="0"]{background:linear-gradient(135deg,#f87171,var(--er));border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(239,68,68,.28)}
.choice.on[data-good="2"]{background:linear-gradient(135deg,#ff8a3d,var(--s));border-color:transparent;color:#fff;
  box-shadow:0 2px 8px rgba(255,106,19,.3)}
.scorebox{display:flex;flex-wrap:wrap;gap:15px;align-items:center;border-radius:12px;padding:13px 15px;margin-top:12px;
  background:linear-gradient(135deg,var(--ac),var(--bg3));border:1px solid #d8ecdf}
.scorebox b{font-size:1.4rem;color:var(--pd)}
.sig{border:1px dashed var(--bd2);border-radius:12px;background:var(--bg3);padding:9px;text-align:center}
.sig canvas{width:100%;height:124px;touch-action:none;background:#fff;border-radius:8px;border:1px solid var(--bd)}
.sigscale{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;
  background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);padding:9px 12px}
.sigscale .lb2{font-size:.78rem;font-weight:700;color:var(--mu);white-space:nowrap}
.sigscale input[type=range]{flex:1;min-width:130px;width:auto;accent-color:var(--p);padding:0;border:0;background:none}
.sigscale .val{font-size:.8rem;font-weight:700;color:var(--pd);white-space:nowrap;min-width:118px}
.hint{font-size:.82rem;color:var(--mu);margin-top:8px;line-height:1.55}

/* ---- บรรทัด "มาตรฐานการตรวจสอบ" ใต้ชื่อรายการ (ฟอร์มตรวจรถ) ---- */
#printArea .std{font-size:10pt;line-height:1.06;color:#222;margin-top:0}
#printArea .sheet.dense .std{font-size:9.5pt}
/* ใบที่มีมาตรฐานจะสูงขึ้นเกือบเท่าตัว จึงบีบทุกส่วนที่บีบได้
   เพื่อไม่ให้ระบบย่อทั้งใบจนตัวหนังสือเล็กเกินอ่าน */
#printArea .sheet.hasstd td{padding:0.5px 5px;line-height:1.1}
#printArea .sheet.hasstd th{padding:1px 5px}
#printArea .sheet.hasstd .note{font-size:10pt;line-height:1.14;margin-top:3px}
#printArea .sheet.hasstd .sign{margin-top:2mm;gap:4mm}
#printArea .sheet.hasstd .srow{margin-top:1.2mm}
#printArea .sheet.hasstd .srow.sig .ln{height:11.5mm}
#printArea .sheet.hasstd .srow.sig .ln img{max-height:10.5mm}
#printArea .sheet.hasstd .sbox{line-height:1.25}

/* ---- ช่องลงนาม แบบเอกสารไทย ---- */
#printArea .sign{display:grid;gap:8mm;margin-top:6mm;font-size:13pt}
#printArea .sbox{width:100%;max-width:82mm;margin:0 auto;line-height:1.4}
#printArea .srow{display:flex;align-items:flex-end;gap:5px;margin-top:2mm}
#printArea .srow .lb{white-space:nowrap;font-size:12.5pt;flex:none;width:16mm;text-align:right}
#printArea .srow .rl{white-space:nowrap;font-size:12.5pt;flex:none}
#printArea .srow .rl.ghost{visibility:hidden}
#printArea .srow .ln{flex:1;border-bottom:1px solid #000;text-align:center;
  min-height:1.3em;padding:0 3px;font-size:12.5pt}
#printArea .srow.sig .ln{position:relative;height:17mm}
#printArea .srow.sig .ln img{position:absolute;left:50%;bottom:.8mm;transform:translateX(-50%);
  max-height:15mm;max-width:98%;object-fit:contain}
#printArea .srow.date .ln{flex:none;width:42mm}
#printArea .srow .nm{flex:1;text-align:center;font-size:12.5pt;padding:0 3px}
#printArea .foot{display:flex;justify-content:space-between;font-size:10.5pt;
  margin-top:auto;padding-top:3px;border-top:1px solid #999}
#printArea .c{text-align:center}

/* ---- ใบตรวจรายเดือน (กระดาษแนวนอน) ---- */
#printArea .sheet.month .pg{font-size:12pt}
#printArea .sheet.month table{font-size:11.5pt}
#printArea .sheet.month th,#printArea .sheet.month td{padding:1px 2px;line-height:1.2}
#printArea .sheet.month td.nm{text-align:left;padding-left:4px}
#printArea .sheet.month .dcol{font-size:10pt;padding:1px 0}
#printArea .sheet.month tbody td{height:5.6mm}
#printArea .sheet.month tr.sec td,#printArea .sheet.month tr.ins td{height:auto}
#printArea .sheet.month tr.sec td{background:#e4e4e4!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-align:left;font-weight:700}
#printArea .sheet.month tr.ins td{font-size:8.5pt}
#printArea .sheet.month .sign{margin-top:4mm;font-size:12pt}
#printArea .sheet.month .note{font-size:11pt}
</style>

/* ============================================================
   โหมดเชื่อมต่อไฟล์ Excel ใหม่ (ผ่านตัวช่วย WT-Paperless-Server.js)
   ถ้าเปิดไฟล์ HTML ตรงๆ จะกลับไปเก็บข้อมูลในเครื่องเหมือนเดิมอัตโนมัติ
   ============================================================ */
let SERVER = false, SERVER_FILE = "";
let NEEDS_AUTH = false;      /* เซิร์ฟเวอร์ขอรหัสไหม (จริงเมื่อเข้าผ่านอุโมงค์) */
let AUTH_GATE  = "";         /* "" = ผ่าน · "connect" = ยังไม่รู้ที่อยู่ · "login" = ต้องใส่รหัส */
let PUBLIC_URL = "";
const saveLocal = save;

/* ---------- ที่อยู่เซิร์ฟเวอร์ที่จะคุยด้วย ----------
   เปิดในออฟฟิศ  : ว่าง = คุยกับ origin เดิม (http://<ip>:8080)
   เปิดจาก GitHub: ต้องมีที่อยู่อุโมงค์ ซึ่งมาจาก ?api=... ใน QR ของเครื่องแม่ */
const CONN_KEY = "wtPaperless.conn";
let CONN = (()=>{ try{ const r = localStorage.getItem(CONN_KEY); if(r) return JSON.parse(r); }catch(e){}
                  return {api:"", token:""}; })();
function saveConn(){ try{ localStorage.setItem(CONN_KEY, JSON.stringify(CONN)); }catch(e){} }
function setApiBase(u){
  const clean = String(u||"").trim().replace(/\/*$/, "");
  const next = clean ? clean + "/" : "";
  if(next !== CONN.api){ CONN.api = next; CONN.token = ""; }   /* เปลี่ยนเครื่องแม่ = ต้องใส่รหัสใหม่ */
  saveConn();
}
(function initConn(){
  const q = new URLSearchParams(location.search).get("api");
  if(q) setApiBase(q);
})();
let CONN_ERR = "";           /* ข้อความอธิบายว่าทำไมต่อไม่ได้ */
let OFFLINE_OK = false;      /* ผู้ใช้เลือก "ใช้งานแบบออฟไลน์" แล้ว */
/* ลองทักเซิร์ฟเวอร์ที่ที่อยู่หนึ่ง — คืน object ถ้าใช่, null ถ้าไม่ใช่ */
function probeBase(base){
  const h = CONN.token ? {Authorization:"Bearer " + CONN.token} : {};
  return fetch((base || "") + "api/ping", {headers:h})
    .then(r=> r.ok ? r.json() : null)
    .then(j=> (j && j.ok && j.mode === "server") ? j : null)
    .catch(()=> null);
}
function apiBase(){ return CONN.api || ""; }
/* รูปลายเซ็นเก็บเป็น path ญาติของเครื่องแม่ — เวลาเปิดจาก GitHub Pages ต้องชี้กลับไปที่เครื่องแม่
   และแนบโทเคนไปด้วย เพราะ <img> ส่ง header Authorization ไม่ได้ */
function sigSrc(v){
  if(!v) return "";
  if(/^(data:|https?:)/i.test(v)) return v;
  const base = CONN.api ? CONN.api.replace(/\/$/, "") + "/" : "";
  return base + v + (CONN.token ? (v.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(CONN.token) : "");
}
function apiOrigin(){ return CONN.api ? CONN.api.replace(/\/$/, "") : location.origin; }

function api(p, body){
  const headers = {};
  if(body) headers["Content-Type"] = "application/json";
  if(CONN.token) headers["Authorization"] = "Bearer " + CONN.token;
  const opt = body ? {method:"POST", headers, body:JSON.stringify(body)} : {headers};
  return fetch(apiBase() + p, opt).then(async r=>{
    const j = await r.json().catch(()=>({ok:false, error:"HTTP " + r.status}));
    if(r.status === 401){ j.needsAuth = true; }
    return j;
  });
}
/* ---------- โหลดข้อมูลหลัก + ประวัติย้อนหลัง จากเครื่องแม่ ----------
   ข้อมูลจริงไม่ได้ฝังอยู่ในไฟล์ HTML แล้ว จึงต้องดึงตอนเปิดแอปทุกครั้ง */
async function loadBootstrap(){
  try{
    const b = await api("api/bootstrap");
    if(!b || !b.ok) return false;
    if(b.master)  Object.assign(MASTER, b.master);
    if(b.history) Object.assign(HISTORY, b.history);
    Object.keys(HIST_CACHE).forEach(k=> delete HIST_CACHE[k]);
    Object.keys(ALL_CACHE).forEach(k=> delete ALL_CACHE[k]);
    PLATE_TYPE = null;
    return true;
  }catch(e){ return false; }
}
async function doLogin(code){
  const r = await api("api/login", {code:String(code||"").trim()});
  if(r && r.ok && r.token){ CONN.token = r.token; saveConn(); return {ok:true}; }
  return {ok:false, error:(r && r.error) || "เชื่อมต่อไม่ได้"};
}
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  INSTALL_PROMPT = e;
  if(state.view === "install") render();

async function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!window.isSecureContext) return;          /* http บนวง LAN จะลงทะเบียนไม่ได้ — ข้ามไปเงียบ ๆ */
  try{
    await navigator.serviceWorker.register("WT-Paperless-SW.js", {scope:"./"});
    SW_OK = true;
  }catch(e){ SW_OK = false; }
}

/* เปิดหน้าที่ต้องการจาก ?go=... (ใช้กับปุ่มลัดบนไอคอนแอป) */
function applyStartUrl(){
  const g = new URLSearchParams(location.search).get("go");
  if(!g) return;
  if(FORM_ORDER.includes(g)) go("list", {fid:g, filter:{}, sel:new Set()});
  else if(g === "employees" || g === "contractors") go("master", {fid:g});
  else if(g === "install" || g === "settings") go(g);
}

async function bootConnect(){
  applyMasterOverride();
  registerSW();
  CONN_ERR = "";

  /* หาเซิร์ฟเวอร์: ใช้ที่อยู่ที่ตั้งไว้ก่อน ถ้าไม่มีค่อยลอง origin ของหน้าเว็บนี้เอง */
  let p = null;
  if(CONN.api){
    p = await probeBase(CONN.api);
    if(!p) CONN_ERR = "เชื่อมต่อกับ " + apiOrigin() + " ไม่ได้ — เครื่องแม่อาจปิดอยู่ หรือที่อยู่เปลี่ยนไปแล้ว";
  } else {
    p = await probeBase("");
  }
  if(!p){
    SERVER = false;
    if(!OFFLINE_OK) AUTH_GATE = "connect";
    return;
  }

  try{
    SERVER = true; SERVER_FILE = p.file || "";
    NEEDS_AUTH = !!p.needsAuth;
    PUBLIC_URL = p.publicUrl || "";
    if(Array.isArray(p.urls)) p.urls.forEach(u=>{ if(!SERVER_URLS.includes(u)) SERVER_URLS.push(u); });

    if(NEEDS_AUTH && !CONN.token){ AUTH_GATE = "login"; return; }
    await loadBootstrap();

    const st = await api("api/state");
    if(st && st.needsAuth){ CONN.token = ""; saveConn(); AUTH_GATE = "login"; return; }
    if(st && st.ok){
      const localOnly = [];
      FORM_ORDER.forEach(f=>{
        const srv = st.records[f] || [];
        const ids = new Set(srv.map(r=>r.id));
        (DB.records[f]||[]).forEach(r=>{ if(!ids.has(r.id)) localOnly.push({fid:f, rec:r}); });
        DB.records[f] = srv;
      });
      if(st.master && (st.master.contractors||st.master.employees)){
        DB.master = st.master; applyMasterOverride();
      }
      if(localOnly.length) DB.pending = (DB.pending||[]).concat(localOnly);
      Object.keys(ALL_CACHE).forEach(k=> delete ALL_CACHE[k]);
      saveLocal();
    }
  }catch(e){ SERVER = false; }
  if(SERVER && (DB.pending||[]).length) await flushPending(true);
}
async function pushToServer(fid, list){
  if(!SERVER) return;
  try{
    const r = await api("api/save", {fid, records:list});
    if(!r || !r.ok) throw new Error((r && r.error) || "บันทึกไม่สำเร็จ");
    (r.records||[]).forEach(sr=>{
      const arr = recs(fid), i = arr.findIndex(x=> x.id===sr.id);
      if(i>=0) arr[i] = sr; else arr.push(sr);
    });
    invalidate(fid); saveLocal();
    toast("บันทึกลงไฟล์ Excel แล้ว");
  }catch(e){
    DB.pending = (DB.pending||[]).concat(list.map(rec=>({fid, rec})));
    saveLocal();
    toast("เก็บไว้ในเครื่องก่อน — ยังส่งเข้า Excel ไม่ได้");
  }
}
async function deleteOnServer(fid, id){
  if(!SERVER) return;
  try{ await api("api/delete", {fid, id}); }catch(e){}
}
async function flushPending(quiet){
  const q = DB.pending || [];
  if(!q.length){ if(!quiet) toast("ไม่มีรายการค้างส่ง"); return; }
  if(!SERVER){ if(!quiet) toast("ยังไม่ได้เชื่อมต่อกับไฟล์ Excel"); return; }
  const left = [];
  const byForm = {};
  q.forEach(x=> (byForm[x.fid] = byForm[x.fid] || []).push(x.rec));
  for(const fid of Object.keys(byForm)){
    try{
      const r = await api("api/save", {fid, records:byForm[fid]});
      if(!r || !r.ok) throw new Error("fail");
      (r.records||[]).forEach(sr=>{
        const arr = recs(fid), i = arr.findIndex(x=> x.id===sr.id);
        if(i>=0) arr[i] = sr; else arr.push(sr);
      });
      invalidate(fid);
    }catch(e){ byForm[fid].forEach(rec=> left.push({fid, rec})); }
  }
  DB.pending = left; saveLocal();
  if(!quiet) toast(left.length ? ("ส่งไม่สำเร็จ "+left.length+" รายการ") : "ส่งข้อมูลค้างเข้าไฟล์ Excel แล้ว");
  render();
}

/* ---------- ข้อมูลย้อนหลังจากไฟล์ Excel (อ่านอย่างเดียว) ---------- */
const HIST_CACHE = {};
const HIST_SIGFIELD = {vehicle:["verifier"], hygiene:["verifier"], glass:["verifier"],
                       truckcheck:["inspector","approver"], evaluate:["inspector"]};
function histRecs(fid){
  if(HIST_CACHE[fid]) return HIST_CACHE[fid];
  const h = (typeof HISTORY!=="undefined") && HISTORY[fid];
  if(!h) return HIST_CACHE[fid] = [];
  const D = h.dict, ci = {}, sigF = HIST_SIGFIELD[fid]||[];
  h.cols.forEach((c,i)=> ci[c]=i);
  const get = (arr,i)=> (arr && i>=0 && arr[i]!=null) ? arr[i] : "";
  const list = h.rows.map((row,ri)=>{
    const r = {id:"H"+fid+"-"+ri, formId:fid, _h:1, items:{}, createdAt:0};
    h.cols.forEach((c,i)=>{
      const v = row[i];
      if(c==="items"){
        const parts = h.numeric ? String(v).split(h.sep||",") : String(get(D.pat,v)).split("");
        h.keys.forEach((k,j)=>{
          const raw = parts[j];
          r.items[k] = h.numeric ? (raw===""||raw==null ? "" : Number(raw)) : (h.map[raw]||"");
        });
      }
      else if(c==="inspector" && D.ins) r.inspector = get(D.ins,v);
      else if(c==="employee") r.employee = get(D.emp,v);
      else if(c==="plate") r.plate = get(D.plate,v);
      else if(c==="contractor") r.contractor = get(D.name,v);
      else if(c==="delivery") r.delivery = get(D.del,v);
      else if(c==="truckType") r.truckType = get(D.truck,v);
      else if(c==="sigId"||c==="sigTime"||c==="sig2Id"||c==="sig2Time"){ /* จัดการด้านล่าง */ }
      else r[c] = v;
    });
    if(ci.sigId!=null && sigF[0]){
      const id = get(D.sig, row[ci.sigId]), tm = row[ci.sigTime];
      if(id) r[sigF[0]] = h.dir+"/"+(tm ? id+"."+h.role+"."+tm : id);
    }
    if(ci.sig2Id!=null && sigF[1]){
      const id = get(D.sig2, row[ci.sig2Id]), tm = row[ci.sig2Time];
      if(id) r[sigF[1]] = h.dir+"/"+(tm ? id+"."+h.role2+"."+tm : id);
    }
    /* ในไฟล์เดิม ช่อง "ชื่อผู้รับเหมา" บางแถวเก็บเป็นรหัส — เทียบกับทะเบียน AVL ให้เป็นชื่อจริง */
    if(r.contractor!==undefined || r.contractorCode!==undefined){
      const byCode = c => MASTER.contractors.find(x=> String(x.code)===String(c));
      if(/^\d+$/.test(String(r.contractor||""))){
        const c = byCode(r.contractor);
        if(c){ if(!r.contractorCode) r.contractorCode = c.code; r.contractor = c.name; }
      }
      if(!r.contractor && r.contractorCode){
        const c = byCode(r.contractorCode); if(c) r.contractor = c.name;
      }
      if(!r.contractorCode && r.contractor){
        const c = MASTER.contractors.find(x=> x.name===r.contractor);
        if(c) r.contractorCode = c.code;
      }
    }
    return r;
  });
  return HIST_CACHE[fid] = list;
}
/* ข้อมูลทั้งหมด = ของเดิมจาก Excel + ที่บันทึกใหม่ในแอป (ใหม่สุดอยู่บน) */
const ALL_CACHE = {};
function allRecs(fid){
  if(ALL_CACHE[fid]) return ALL_CACHE[fid];
  const list = histRecs(fid).concat(recs(fid));
  list.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  return ALL_CACHE[fid] = list;
}
function invalidate(fid){ delete ALL_CACHE[fid]; }
function countAll(fid){ return histRecs(fid).length + recs(fid).length; }

const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const nowHM = () => new Date().toTimeString().slice(0,5);
const THMON = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function thDate(iso){
  if(!iso) return "";
  const p = String(iso).split("-"); if(p.length!==3) return iso;
  return `${+p[2]}/${+p[1]}/${+p[0]+543}`;
}
function thLong(iso){
  if(!iso) return "";
  const p = String(iso).split("-"); if(p.length!==3) return iso;
  return `${+p[2]} ${THMON[+p[1]]} ${+p[0]+543}`;
}
/* ---------- ตัวช่วยของฟอร์มรายเดือน (หนึ่งใบ = หนึ่งเดือน) ---------- */
const thisMonth = () => todayISO().slice(0,7);
function ymOf(r){ return String(r.month || (r.date||"").slice(0,7) || ""); }
function daysInMonth(ym){
  const p = String(ym||"").split("-");
  if(p.length < 2 || !+p[0] || !+p[1]) return 31;
  return new Date(+p[0], +p[1], 0).getDate();
}
function thMonth(ym){
  const p = String(ym||"").split("-");
  return (p.length>=2 && +p[1]) ? THMON[+p[1]] + " " + (+p[0]+543) : "";
}
function dayVal(r, k, d){
  const o = r.items && r.items[k];
  return (o && typeof o === "object") ? (o[d] || "") : "";
}
function setDayVal(r, k, d, v){
  r.items = r.items || {};
  let o = r.items[k];
  if(!o || typeof o !== "object") o = r.items[k] = {};
  if(v === "" || v == null) delete o[d]; else o[d] = v;
}
/* ชื่อสั้นสำหรับช่อง "ผู้ตรวจสอบ" รายวันในใบพิมพ์ (ใช้ชื่อเล่นถ้ามี) */
function shortName(nm){
  const s0 = String(nm||"").trim();
  if(!s0) return "";
  const e = (typeof empOf === "function") ? empOf(s0) : null;
  if(e && e.nick) return e.nick;
  const s = s0.replace(/^(นางสาว|นาย|นาง)\s*/, "").trim();
  return (s.split(/\s+/)[0] || "").slice(0, 7);
}
function monthScore(f, r){
  const items = allItems(f), n = daysInMonth(ymOf(r));
  let ng = 0, days = 0, cells = 0;
  const ngDays = [], fullDays = [];
  for(let d=1; d<=n; d++){
    let c = 0, bad = 0;
    items.forEach(i=>{
      const v = dayVal(r, i.k, d);
      if(v === "") return;
      c++; cells++;
      if(f.scale.some(s=> String(s.v)===String(v) && s.good===0)) bad++;
    });
    if(c){ days++; if(bad){ ng += bad; ngDays.push(d); } }
    if(c === items.length && !bad) fullDays.push(d);
  }
  return {ng, ngItems:ngDays.map(d=>"วันที่ "+d), ngDays, total:n, days, cells,
          full:fullDays.length, items:items.length};
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900);
}
function allItems(f){ return f.groups.flatMap(g=>g.items); }
function scoreOf(f, r){
  if(f.monthly) return monthScore(f, r);
  const items = allItems(f);
  if(f.weighted){
    const sum = items.reduce((a,i)=>a+(Number(r.items&&r.items[i.k])||0),0);
    const max = items.reduce((a,i)=>a+i.max,0);
    const gr = (f.grades.find(g=>sum>=g.min)) || f.grades[f.grades.length-1];
    return {sum, max, pct: Math.round(sum/max*10000)/100, grade:gr.g, level:gr.lv, result:gr.res};
  }
  if(f.scoring){
    const sum = items.reduce((a,i)=>a+(Number(r.items&&r.items[i.k])||0),0);
    const max = items.length * f.scoring.max;
    const pct = Math.round(sum/max*10000)/100;
    const pass = pct >= f.scoring.passPct;
    return {sum, max, pct, pass,
      result: pass ? "ผ่าน" : "ต้องปรับปรุง",
      action: pass ? "รับเป็นผู้ส่งมอบต่อไป" : "รับเป็นผู้ส่งมอบต่อไป และแจ้งให้ทำการแก้ไขปรับปรุง"};
  }
  const bad = items.filter(i=>{
    const v = r.items && r.items[i.k];
    const sc = f.scale.find(s=>String(s.v)===String(v));
    return sc && sc.good===0;
  });
  return {ng:bad.length, ngItems:bad.map(i=>i.k), total:items.length};
}

function formStat(fid){
  const t = todayISO();
  let latest = "", today = 0;
  const scan = arr =>{
    for(let i=0;i<arr.length;i++){
      const d = arr[i].date || "";
      if(d > latest) latest = d;
      if(d === t) today++;
    }
  };
  const h = histRecs(fid), n = recs(fid);
  scan(h); scan(n);
  return {total:h.length + n.length, neu:n.length, today, latest};
}
function sectHead(title, right){

    (right ? `<span class="r">${esc(right)}</span>` : ""));
}

  csvBtn.onclick = ()=> exportCSV(f, filtered(all));
  /* บนคอมพิวเตอร์ .tb-fold คือ display:contents — เรียงเหมือนเดิมทุกอย่าง
     บนมือถือจะยุบเป็นปุ่ม “ตัวกรอง / ส่งออก” เพื่อให้เห็นรายการเร็วขึ้น */
  const fold = el("div","tb-fold");

  if(sumBtn) fold.appendChild(sumBtn);
  const foldBtn = el("button","btn tb-foldbtn","⚙ ตัวกรอง / ส่งออก");
  foldBtn.onclick = ()=>{
    const on = fold.classList.toggle("open");
    foldBtn.classList.toggle("on", on);
    foldBtn.textContent = on ? "⚙ ซ่อนตัวกรอง" : "⚙ ตัวกรอง / ส่งออก";
  };
  tb.append(q, foldBtn, fold, el("div","spacer"));
  if(addOne) tb.appendChild(addOne);
  tb.appendChild(addBtn);
  if(quickBtn) tb.appendChild(quickBtn);
  app.appendChild(tb);

  app.appendChild(el("div","count-note","แตะที่แถวไหนก็ได้เพื่อเปิดดู/แก้ไขรายการนั้น · ปุ่ม “พิมพ์” "
    + (f.monthly ? "จะพิมพ์เป็นตารางทั้งเดือน 1 แผ่น (กระดาษแนวนอน)"
     : f.evalMulti ? "จะพิมพ์เป็นใบแยกรายบุคคล ส่วน “พิมพ์สรุปรวม” จะได้ตารางคะแนนทุกคันในใบเดียว"
     : f.printMode==="doc" ? "จะพิมพ์เป็นใบแยกทีละรายการ" : "จะพิมพ์รวมทั้งวันให้ในใบเดียว")));
  const wrap = el("div","tablewrap cardify");
  app.appendChild(wrap);
  renderRows();

  function filtered(list){
    const s = (state.filter.q||"").trim().toLowerCase();
    return list.filter(r=>{
      if(state.filter.y && (r.date||"").slice(0,4)!==state.filter.y) return false;
      if(state.filter.m && (r.date||"").slice(5,7)!==state.filter.m) return false;
      if(s && !JSON.stringify(r).toLowerCase().includes(s)) return false;
      return true;
    });
  }
  function selectedRecords(list){
    const sel = filtered(list).filter(r=>state.sel.has(r.id));
    return sel.length ? sel : filtered(list);
  }
  function renderRows(){
    const list = filtered(all);
    if(!list.length){
      wrap.innerHTML = `<div class="empty">ไม่พบข้อมูลตามเงื่อนไขที่เลือก<br><br>ลองเปลี่ยนปี/เดือน หรือกด <b>+ บันทึกใหม่</b></div>`;
      return;
    }
    const PAGE = 300;
    const shown = list.slice(0, (state.page||1)*PAGE);
    const cols = f.listCols;
    let h = `<table><thead><tr><th style="width:34px"><input type="checkbox" id="selAll"></th>`
      + cols.map(c=>`<th>${esc(c.t)}</th>`).join("")
      + `<th>สถานะ</th><th></th></tr></thead><tbody>`;
    shown.forEach(r=>{
      const sc = scoreOf(f, r);
      let status;
      if(f.weighted) status = `<span class="pill ${(sc.grade==="A"||sc.grade==="B")?"ok":sc.grade==="C"?"warn":"ng"}">เกรด ${sc.grade} · ${sc.level}</span>`;
      else if(f.scoring) status = `<span class="pill ${sc.pass?"ok":"ng"}">${sc.result}</span>`;
      else status = sc.ng ? `<span class="pill ng">พบ ${sc.ng} รายการ</span>` : `<span class="pill ok">ปกติ</span>`;
      h += `<tr class="rowlink" data-id="${r.id}" data-open="${r._h?"view":"edit"}"><td class="sel"><input type="checkbox" class="rowSel" data-id="${r.id}" ${state.sel.has(r.id)?"checked":""}></td>`
        + cols.map((c,ci)=>{
            let v = c.k==="_pct" ? sc.pct+"%" : c.k==="_result" ? sc.result
                  : c.k==="_score" ? sc.sum+"/"+sc.max : c.k==="_grade" ? sc.grade
                  : c.k==="_month" ? thMonth(ymOf(r))
                  : c.k==="_days" ? (sc.days||0)+" / "+(sc.total||0)+" วัน"
                  : c.k==="date" ? thDate(r.date) : r[c.k];
            if(typeof v==="string" && v.length>40) v = v.slice(0,40)+"…";
            return `<td class="${ci===0?"pri":""}" data-label="${esc(c.t)}">${esc(v)}</td>`;
          }).join("")
        + `<td data-label="สถานะ">${status}${r._h? ` <span class="pill" style="background:#eef1f5;color:var(--muted)">เดิม</span>`:""}</td>`
        + `<td class="acts"><div class="rowacts">`
        + `<button class="btn sm" data-act="copy" data-id="${r.id}">ทำซ้ำ</button>`
        + `<button class="btn sm" data-act="print" data-id="${r.id}">พิมพ์</button>`
        + (r._h ? "" : `<button class="btn sm danger" data-act="del" data-id="${r.id}">ลบ</button>`)
        + `</div></td></tr>`;
    });
    h += `</tbody></table>`;
    wrap.innerHTML = h;
    if(shown.length < list.length){
      const more = el("div","empty");
      more.innerHTML = `แสดง ${shown.length.toLocaleString("th-TH")} จาก ${list.length.toLocaleString("th-TH")} รายการ `;
      const mb = el("button","btn","แสดงเพิ่ม 300 รายการ");
      mb.onclick = ()=>{ state.page = (state.page||1)+1; renderRows(); };
      more.appendChild(mb);
      wrap.appendChild(more);
    }
    wrap.querySelector("#selAll").onchange = e=>{
      shown.forEach(r=> e.target.checked ? state.sel.add(r.id) : state.sel.delete(r.id));
      renderRows();
    };
    wrap.querySelectorAll(".rowSel").forEach(cb=>{
      cb.onclick = e=> e.stopPropagation();
      cb.onchange = ()=>{ cb.checked ? state.sel.add(cb.dataset.id) : state.sel.delete(cb.dataset.id); };
    });
    /* กดตรงไหนของแถวก็เปิดรายการได้ */
    wrap.querySelectorAll("tr.rowlink").forEach(tr=> tr.onclick = ()=>{
      const r = all.find(x=> x.id===tr.dataset.id);
      if(!r) return;
      if(tr.dataset.open==="view") go("old",{fid:f.id, id:r.id});
      else go("form",{fid:f.id, id:r.id});
    });
    wrap.querySelectorAll("button[data-act]").forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();
      const r = all.find(x=>x.id===b.dataset.id);
      const act = b.dataset.act;
      if(act==="edit") go("form",{fid:f.id, id:r.id});
      if(act==="view") go("old",{fid:f.id, id:r.id});
      if(act==="print") doPrint(f, printGroup(f, r));
      if(act==="copy"){
        state.draft = duplicateRecord(f, r);
        go("form",{fid:f.id, id:null, keepDraft:1});
        toast("คัดลอกเป็นรายการใหม่ — ตรวจสอบและเซ็นใหม่ก่อนบันทึก");
      }
      if(act==="del"){
        if(confirm("ลบรายการนี้? (ข้อมูลเดิมในไฟล์ Excel เก่า ไม่ถูกแตะต้อง)")){
          DB.records[f.id] = recs(f.id).filter(x=>x.id!==r.id);
          state.sel.delete(r.id); save();
          if(SERVER) deleteOnServer(f.id, r.id);
          toast("ลบแล้ว"); render();
        }
      }
    });
  }
}

/* ---------- ทำซ้ำเป็นรายการใหม่ (ไม่คัดลอกลายเซ็นและการทวนสอบ) ---------- */
function duplicateRecord(f, r){
  const c = JSON.parse(JSON.stringify(r));
  c.id = uid(); delete c._h;
  c.createdAt = Date.now(); delete c.updatedAt;
  c.date = todayISO();
  if(f.monthly){ c.month = thisMonth(); c.date = c.month + "-01"; }
  f.footer.filter(x=> x.type==="sign").forEach(fd=>{ c[fd.k] = ""; c[fd.k+"Name"] = ""; delete c[fd.k+"Scale"]; });
  ["verifyDate","approveDate"].forEach(k=>{ if(c[k]!==undefined) c[k] = ""; });
  if(f.header.some(h=>h.k==="time") || f.footer.some(h=>h.k==="time")) c.time = nowHM();
  return c;
}

/* ============================================================
   FIELD RENDERING
   ============================================================ */
function fieldNode(fd, rec, onChange){
  const wrap = el("label","f", `<span>${esc(fd.label)}${fd.req?" *":""}</span>`);
  let input;
  if(fd.type==="textarea"){ input = el("textarea"); input.value = rec[fd.k]||""; }
  else if(fd.type==="select"){
    input = el("select");
    input.innerHTML = `<option value="">— เลือก —</option>` + fd.opts.map(o=>`<option ${rec[fd.k]===o?"selected":""}>${esc(o)}</option>`).join("");
  }
  else if(fd.type==="list"){
    input = el("input"); input.type="text"; input.setAttribute("list","dl_"+fd.src); input.value = rec[fd.k]||"";
    if(!document.getElementById("dl_"+fd.src)){
      const dl = el("datalist"); dl.id = "dl_"+fd.src;
      dl.innerHTML = mlist(fd.src).map(v=>`<option value="${esc(v)}">`).join("");
      document.body.appendChild(dl);
    }
  }
  else if(fd.type==="contractor"){
    input = el("select");
    const cur = String(rec[fd.k]||"");
    const duo = conDuo(MASTER.contractors);
    const opt = c=>{ const d = duo[c.code] || {n:1,i:1};
      return `<option value="${esc(c.code)}" ${cur===String(c.code)?"selected":""}>${esc(c.code)} — ${esc(c.name)} (${esc(c.plate)})${d.n>1?" · คนที่ "+d.i+" จาก "+d.n:""}${c.off?" · ออกแล้ว":""}</option>`; };
    const pick = t=> conSorted(MASTER.contractors).filter(c=> c.type===t && (!c.off || cur===String(c.code)));
    input.innerHTML = `<option value="">— เลือกผู้รับเหมา —</option>`
      + `<optgroup label="กล่อง (BOX)">` + pick("BOX").map(opt).join("") + `</optgroup>`
      + `<optgroup label="แผ่น (SHEET)">` + pick("SHEET").map(opt).join("") + `</optgroup>`;
    input.onchange = ()=>{
      const c = MASTER.contractors.find(x=>String(x.code)===input.value);
      rec[fd.k] = input.value;
      if(c){
        rec.contractor = c.name; rec.plate = c.plate; rec.delivery = c.type;
        const tt = truckTypeOf(c.plate);      /* ทะเบียนมีพยัญชนะไทย = กะบะ · เลขล้วน = 6 ล้อ */
        if(tt) rec.truckType = tt;
      }
      onChange(true);
    };
  }
  else if(fd.type==="sign"){ return signNode(fd, rec, onChange, FORMS[rec.formId]); }
  else { input = el("input"); input.type = fd.type||"text"; input.value = rec[fd.k]||""; }

  if(fd.type!=="contractor"){
    input.onchange = ()=>{ rec[fd.k] = input.value; onChange(fd.triggersDerive===true ? true : false); };
    input.oninput  = ()=>{ rec[fd.k] = input.value; };
  }
  wrap.appendChild(input);
  if(fd.hint) wrap.appendChild(el("div","hint", esc(fd.hint)));
  return wrap;
}

/* ตัดขอบขาว/โปร่งใสรอบลายเซ็นออก เพื่อให้เต็มกรอบตอนพิมพ์ */
function trimImage(dataUrl, cb){
  const im = new Image();
  im.onload = ()=>{
    try{
      const w = im.width, h = im.height;
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d", {willReadFrequently:true});
      ctx.drawImage(im, 0, 0);
      const d = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for(let y=0; y<h; y++){
        for(let x=0; x<w; x++){
          const i = (y*w + x) * 4;
          const a = d[i+3];
          if(a < 24) continue;                                   /* โปร่งใส */
          const lum = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
          if(lum > 232) continue;                                /* ขาว/ใกล้ขาว */
          if(x < x0) x0 = x; if(x > x1) x1 = x;
          if(y < y0) y0 = y; if(y > y1) y1 = y;
        }
      }
      if(x1 < 0 || (x1-x0) < w*0.04 || (y1-y0) < h*0.04) return cb(dataUrl);   /* ตัดไม่ได้ผล */
      const pad = Math.round(Math.max(w, h) * 0.015);
      x0 = Math.max(0, x0-pad); y0 = Math.max(0, y0-pad);
      x1 = Math.min(w-1, x1+pad); y1 = Math.min(h-1, y1+pad);
      const cw = x1-x0+1, ch = y1-y0+1;
      const out = document.createElement("canvas");
      out.width = cw; out.height = ch;
      out.getContext("2d").drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);
      cb(out.toDataURL("image/png"));
    }catch(e){ cb(dataUrl); }
  };
  im.onerror = ()=> cb(dataUrl);
  im.src = dataUrl;
}

/* ย่อรูปลายเซ็นก่อนเก็บ กันไฟล์ใหญ่เกินจำเป็น */
function shrinkImage(dataUrl, maxW, cb){
  const im = new Image();
  im.onload = ()=>{
    const sc = Math.min(1, maxW / (im.width||maxW));
    const w = Math.max(1, Math.round(im.width*sc)), h = Math.max(1, Math.round(im.height*sc));
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const ctx = cv.getContext("2d");
    ctx.drawImage(im, 0, 0, w, h);
    const isPng = /^data:image\/png/i.test(dataUrl);
    let out;
    try{ out = cv.toDataURL(isPng ? "image/png" : "image/jpeg", .92); }
    catch(e){ out = dataUrl; }
    cb(out.length < dataUrl.length ? out : dataUrl);
  };
  im.onerror = ()=> cb(dataUrl);
  im.src = dataUrl;
}
/* เก็บลายเซ็นล่าสุดของแต่ละชื่อ ไว้เรียกใช้ครั้งหน้า */
function rememberSignature(name, img){
  name = String(name||"").trim();
  if(!name || !img || img.length > 120000) return;
  DB.prefs.sigLib = DB.prefs.sigLib || {};
  DB.prefs.sigLib[name] = img;
  const keys = Object.keys(DB.prefs.sigLib);
  while(keys.length > 12) delete DB.prefs.sigLib[keys.shift()];
}
function refreshSignerList(){
  let dl = document.getElementById("dl_signers");
  if(!dl){ dl = el("datalist"); dl.id = "dl_signers"; document.body.appendChild(dl); }
  const order = DB.prefs.signerOrder || [];
  dl.innerHTML = order.map(v=> `<option value="${esc(v)}">`).join("");
}
function rememberSigner(name, pos){
  name = String(name||"").trim();
  if(!name) return;
  DB.prefs.signers = DB.prefs.signers || {};
  if(pos) DB.prefs.signers[name] = pos;
  DB.prefs.signerOrder = [name].concat((DB.prefs.signerOrder||[]).filter(x=> x!==name)).slice(0, 15);
}

  /* ชื่อ + ตำแหน่ง ผู้ลงนาม (แก้ไขได้ และระบบจำรายชื่อไว้ให้เลือก) */

  rec[fd.k+"Pos"] = posIn.value;
  nameIn.oninput = ()=>{

    if(known && !posIn.value){ posIn.value = known; rec[fd.k+"Pos"] = known; }

  };
  posIn.oninput = ()=>{ rec[fd.k+"Pos"] = posIn.value; };
  refreshSignerList();
  nameW.appendChild(nameIn); posW.appendChild(posIn);

  wrap.append(box, btns, scaleWrap, idInfo);
  applyScale();
  wrap.appendChild(el("div","hint","เซ็นด้วยนิ้ว/เมาส์ในกรอบ หรือกด “อัปโหลดรูปลายเซ็น” (ถ่ายรูป/เลือกไฟล์ก็ได้)<br>ชื่อและตำแหน่งจะไปแสดงใต้ลายเซ็นในใบพิมพ์ · ระบบจำรายชื่อและลายเซ็นที่เคยใช้ไว้ให้เรียกกลับมาได้"));

  refreshSaved(); refreshPin();
  if(!has) attachPad();
  clr.onclick = ()=>{
    rec[fd.k]="";
    box.innerHTML = `<canvas></canvas>`;
    clr.textContent="ล้างลายเซ็น";
    attachPad(); refreshSaved(); refreshPin();
  };

  function attachPad(){
    const cv = box.querySelector("canvas"); if(!cv) return;
    if(cv._padOn) return;                       /* กันผูกซ้ำถ้าถูกเรียกหลายรอบ */
    cv._padOn = true;

    let ctx = null, drawing = false, inked = false;

    /* ---- ตั้งขนาดบิตแมปให้ตรงกับขนาดที่แสดงจริง ----
       ทำทันที ไม่รอ requestAnimationFrame เพราะถ้าแท็บถูกซ่อนอยู่
       เฟรมจะไม่มา แล้วแป้นจะใช้ไม่ได้เลยทั้งที่ผู้ใช้เห็นกรอบอยู่ */
    function fitCanvas(){
      const ratio = window.devicePixelRatio || 1;
      const w = cv.offsetWidth  || cv.parentElement.offsetWidth || 300;
      const h = cv.offsetHeight || 124;
      const nw = Math.max(1, Math.round(w*ratio)), nh = Math.max(1, Math.round(h*ratio));
      if(cv.width === nw && cv.height === nh && ctx) return;
      /* เก็บสิ่งที่วาดไว้ก่อนเปลี่ยนขนาด (การตั้ง width/height จะล้าง canvas) */
      let keep = null;
      if(inked && cv.width && cv.height){ try{ keep = cv.toDataURL("image/png"); }catch(e){} }
      cv.width = nw; cv.height = nh;
      ctx = cv.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 2.2; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.strokeStyle = "#111";
      if(keep){ const im = new Image(); im.onload = ()=> ctx.drawImage(im, 0, 0, w, h); im.src = keep; }
    }
    fitCanvas();
    if(!cv.width || !cv.offsetWidth) requestAnimationFrame(fitCanvas);   /* เผื่อ layout ยังไม่เสร็จ */
    const ro = window.ResizeObserver ? new ResizeObserver(()=> fitCanvas()) : null;
    if(ro) ro.observe(cv);

    const at = e =>{
      const r = cv.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    };

    /* ---- บันทึกเข้า rec ทันที แล้วค่อยตัดขอบขาวตามทีหลัง ----
       เดิมรอ trimImage ซึ่งทำงานแบบ async ถ้าผู้ใช้กด "บันทึก" เร็ว
       ลายเซ็นจะยังไม่เข้า rec ทำให้ใบที่บันทึกไม่มีลายเซ็น */
    function commit(){
      if(!inked) return;
      let raw = "";
      try{ raw = cv.toDataURL("image/png"); }catch(e){ return; }
      rec[fd.k] = raw;                                   /* มีค่าทันที ไม่มีช่วงว่าง */
      refreshPin();
      /* ตัดขอบขาวต่อทันที (ใช้เวลาไม่กี่มิลลิวินาที) — ห้ามหน่วง
         ไม่งั้นถ้าผู้ใช้กดบันทึกเร็ว จะได้รูปที่ยังไม่ตัดขอบไปแทน */
      trimImage(raw, url=>{ if(rec[fd.k] === raw) rec[fd.k] = url; refreshPin(); });
    }

    const down = e=>{
      if(e.button !== undefined && e.button !== 0) return;   /* เฉพาะปุ่มซ้าย */
      fitCanvas();
      drawing = true; inked = true;                          /* แตะจุดเดียวก็ถือว่าเซ็นแล้ว */
      const [x,y] = at(e);
      ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x+0.01, y);  ctx.stroke();                  /* ให้จุดเดียวมีหมึกจริง */
      try{ cv.setPointerCapture(e.pointerId); }catch(err){}  /* ลากออกนอกกรอบได้ */
      e.preventDefault();
    };
    const move = e=>{
      if(!drawing) return;
      const [x,y] = at(e);
      ctx.lineTo(x, y); ctx.stroke();
      e.preventDefault();
    };
    const up = e=>{
      if(!drawing) return;
      drawing = false;
      try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
      commit();
      e.preventDefault();
    };

    /* Pointer Events ครอบคลุมทั้งเมาส์ นิ้ว และปากกา ในทางเดียว
       ถ้าเบราว์เซอร์เก่าไม่รองรับ ค่อยถอยไปใช้ mouse/touch แบบเดิม */
    if(window.PointerEvent){
      cv.addEventListener("pointerdown", down);
      cv.addEventListener("pointermove", move);
      cv.addEventListener("pointerup", up);
      cv.addEventListener("pointercancel", up);
      cv.addEventListener("pointerleave", e=>{ if(drawing) commit(); });
    } else {
      const t = fn => e=>{ const p = e.touches && e.touches[0] ? e.touches[0] : e; fn(Object.assign({}, p, {preventDefault:()=>e.preventDefault(), button:0})); };
      cv.addEventListener("mousedown", down);
      cv.addEventListener("mousemove", move);
      cv.addEventListener("mouseup", up);
      cv.addEventListener("mouseleave", e=>{ if(drawing){ drawing=false; commit(); } });
      cv.addEventListener("touchstart", t(down), {passive:false});
      cv.addEventListener("touchmove",  t(move), {passive:false});
      cv.addEventListener("touchend",   e=>{ if(drawing){ drawing=false; commit(); } e.preventDefault(); }, {passive:false});
    }

    /* กันตกหล่น: ถ้ามีการเขียนค้างอยู่ตอนหน้าจอถูกวาดใหม่หรือปิดหน้า ให้บันทึกก่อน */
    cv._padFlush = ()=>{ if(inked) commit(); if(ro) ro.disconnect(); };
  }
  return wrap;
}

function choiceRow(f, item, rec, onChange){
  const row = el("div","item");
  row.innerHTML = `<div class="txt"><b>${esc(item.k)} ${esc(item.t)}</b>${item.s?`<small>มาตรฐาน: ${esc(item.s)}</small>`:""}${item.max?`<small>คะแนนเต็ม ${item.max} คะแนน</small>`:""}</div>`;
  const ch = el("div","choices");
  if(f.weighted){
    const inp = el("input"); inp.type="number"; inp.min=0; inp.max=item.max; inp.style.width="86px";
    inp.value = rec.items[item.k]!=null ? rec.items[item.k] : "";
    inp.oninput = ()=>{
      let v = Math.min(item.max, Math.max(0, Number(inp.value)||0));
      rec.items[item.k] = inp.value===""? "" : v; onChange();
    };
    ch.appendChild(inp);
  } else {
    f.scale.forEach(s=>{
      const b = el("button","choice", String(s.v));
      b.dataset.good = s.good;
      if(String(rec.items[item.k])===String(s.v)) b.classList.add("on");
      b.onclick = ()=>{
        rec.items[item.k] = (String(rec.items[item.k])===String(s.v)) ? "" : s.v;
        ch.querySelectorAll(".choice").forEach(x=>x.classList.remove("on"));
        if(rec.items[item.k]!=="") b.classList.add("on");
        onChange();
      };
      ch.appendChild(b);
    });
  }
  row.appendChild(ch);
  return row;
}

/* ============================================================
   VIEW: FORM (single record)
   ============================================================ */
function viewForm(app){
  const f = FORMS[state.fid];
  const existing = state.id ? recs(f.id).find(r=>r.id===state.id) : null;
  const draft = state.draft;
  const rec = (draft && draft.formId===f.id && (state.id ? draft.id===state.id : !recs(f.id).some(r=>r.id===draft.id)))
    ? draft
    : (existing ? JSON.parse(JSON.stringify(existing)) : newRecord(f));
  state.draft = rec;
  setTitle(f.title, (existing?"แก้ไขรายการ":"บันทึกใหม่")+" · "+f.code+" "+f.rev);

  const pHead = el("div","panel"); pHead.appendChild(el("h2",null,"ข้อมูลหลัก"));
  const bHead = el("div","body"); const fldsH = el("div","fields");
  f.header.forEach(fd=> fldsH.appendChild(fieldNode(fd, rec, redrawIf)));
  bHead.appendChild(fldsH); pHead.appendChild(bHead); app.appendChild(pHead);

  const pItems = el("div","panel"); pItems.appendChild(el("h2",null,"รายการตรวจสอบ"));
  const bItems = el("div","body");
  const quick = el("div","toolbar");
  if(!f.weighted){
    const good = f.scale.find(s=>s.good===1);
    const allBtn = el("button","btn sm",`เลือก “${good.v}” ทั้งหมด`);
    allBtn.onclick = ()=>{ allItems(f).forEach(i=> rec.items[i.k]=good.v); redraw(); };
    const clrBtn = el("button","btn sm","ล้างทั้งหมด");
    clrBtn.onclick = ()=>{ rec.items = {}; redraw(); };
    quick.append(allBtn, clrBtn);
  } else {
    const fullBtn = el("button","btn sm","ให้คะแนนเต็มทุกข้อ");
    fullBtn.onclick = ()=>{ allItems(f).forEach(i=> rec.items[i.k]=i.max); redraw(); };
    quick.append(fullBtn);
  }
  bItems.appendChild(quick);
  f.groups.forEach(g=>{
    bItems.appendChild(el("div","grp", esc(g.t)));
    g.items.forEach(it=> bItems.appendChild(choiceRow(f, it, rec, updateScore)));
  });
  const sb = el("div","scorebox"); sb.id="scoreBox";
  bItems.appendChild(sb);
  pItems.appendChild(bItems); app.appendChild(pItems);

  const pFoot = el("div","panel"); pFoot.appendChild(el("h2",null,"ผู้ตรวจ / การทวนสอบ"));
  const bFoot = el("div","body"); const fldsF = el("div","fields");
  f.footer.forEach(fd=> fldsF.appendChild(fieldNode(fd, rec, ()=>{})));
  bFoot.appendChild(fldsF);
  if(f.note) bFoot.appendChild(el("div","hint", esc(f.note).replace(/\n/g,"<br>")));
  pFoot.appendChild(bFoot); app.appendChild(pFoot);

  const bar = el("div","bar");
  const cancel = el("button","btn","ยกเลิก"); cancel.onclick = ()=> go("list",{fid:f.id});
  const saveP = el("button","btn","บันทึก + พิมพ์");
  saveP.onclick = ()=>{ if(commit()) doPrint(f, printGroup(f, rec)); };
  const saveB = el("button","btn primary","บันทึก");
  saveB.onclick = ()=>{ if(commit()) go("list",{fid:f.id}); };
  bar.append(cancel,saveP,saveB); app.appendChild(bar);

  updateScore();

  function redrawIf(need){
    let changed = need;
    if(f.id==="vehicle" && rec.plate){
      const t = plateType(rec.plate);
      if(t && rec.delivery !== t){ rec.delivery = t; changed = true; }
    }
    if(changed) redraw();
  }
  function redraw(){ state.draft = rec; go("form",{fid:f.id, id:state.id, keepDraft:1}); }
  function updateScore(){
    const sc = scoreOf(f, rec);
    if(f.weighted)
      sb.innerHTML = `<div>คะแนนรวม <b>${sc.sum}</b> / ${sc.max}</div><div>เกรด <b>${sc.grade}</b></div><div>ระดับ <b>${sc.level}</b></div><div style="flex-basis:100%;font-size:14px;color:var(--muted)">${esc(sc.result)}</div>`;
    else if(f.scoring)
      sb.innerHTML = `<div>คะแนน <b>${sc.sum}</b> / ${sc.max}</div><div><b>${sc.pct}%</b></div><div>ผล <b style="color:${sc.pass?"var(--ok)":"var(--ng)"}">${sc.result}</b></div><div style="flex-basis:100%;font-size:14px;color:var(--muted)">การดำเนินงาน: ${esc(sc.action)}</div>`;
    else {
      const done = allItems(f).filter(i=> rec.items[i.k]!==undefined && rec.items[i.k]!=="").length;
      sb.innerHTML = sc.ng
        ? `<div style="color:var(--ng)">พบไม่ผ่าน <b style="color:var(--ng)">${sc.ng}</b> รายการ: ${sc.ngItems.join(", ")}</div><div style="font-size:14px;color:var(--muted)">กรอกแล้ว ${done}/${sc.total} ข้อ</div>`
        : done===sc.total
          ? `<div>ผลตรวจ <b style="color:var(--ok)">ปกติทุกรายการ</b> (${done}/${sc.total} ข้อ)</div>`
          : `<div>กรอกแล้ว <b>${done}</b> / ${sc.total} ข้อ${done? " — ยังไม่พบรายการไม่ผ่าน":""}</div>`;
    }
  }
  function commit(){
    for(const fd of f.header.concat(f.footer)){
      if(fd.req && !rec[fd.k]){ alert("กรุณากรอก: "+fd.label); return false; }
    }
    rec.updatedAt = Date.now();
    if(f.id==="vehicle") learnPlateType(rec.plate, rec.delivery);
    const autoSig = fillMissingSigners(f, rec);
    f.footer.filter(x=> x.type==="sign").forEach(fd=>{
      rememberSigner(rec[fd.k+"Name"], rec[fd.k+"Pos"] || fd.pos);
      rememberSignature(rec[fd.k+"Name"], rec[fd.k]);
    });
    keepSigners(f, rec);
    if(autoSig.length) setTimeout(()=> toast("เติมลายเซ็น" + autoSig.join(" / ") + " จากที่เคยเซ็นไว้ให้อัตโนมัติ"), 1500);
    refreshSignerList();
    f.header.concat(f.footer).forEach(fd=>{ if(fd.remember) DB.prefs[f.id+"."+fd.k] = rec[fd.k]; });
    const list = recs(f.id);
    const i = list.findIndex(r=>r.id===rec.id);
    if(i>=0) list[i] = rec; else list.push(JSON.parse(JSON.stringify(rec)));
    state.draft = null;
    save();
    if(SERVER) pushToServer(f.id, [rec]); else toast("บันทึกแล้ว");
    return true;
  }
}

function newRecord(f){
  const r = {id:uid(), formId:f.id, items:{}, createdAt:Date.now()};
  f.header.concat(f.footer).forEach(fd=>{
    if(fd.def==="thisMonth"){ r[fd.k] = thisMonth(); r.date = r[fd.k] + "-01"; }
    else if(fd.def==="today") r[fd.k] = todayISO();
    else if(fd.def==="now") r[fd.k] = nowHM();
    else if(fd.remember && DB.prefs[f.id+"."+fd.k]) r[fd.k] = DB.prefs[f.id+"."+fd.k];
    else r[fd.k] = "";
  });
  applyDefaultSigners(f, r);
  return r;
}

/* ---------- ลายเซ็นประจำตัว: อัปโหลดครั้งเดียว ใช้ได้ตลอด ---------- */
function defaultSigner(fid, key){
  return (DB.prefs.defSign || {})[fid + "." + key] || null;
}
function setDefaultSigner(fid, key, obj){
  DB.prefs.defSign = DB.prefs.defSign || {};
  if(obj && (obj.img || obj.name)) DB.prefs.defSign[fid+"."+key] = obj;
  else delete DB.prefs.defSign[fid+"."+key];
}
/* ---------- ลายเซ็นล่าสุด ใช้ต่อข้ามฟอร์มได้ ---------- */
function lastSignOf(key){ return (DB.prefs.lastSign || {})[key] || null; }
function rememberLastSign(key, obj){
  if(!obj || (!obj.img && !obj.name)) return;
  if(obj.img && obj.img.length > 200000) return;
  DB.prefs.lastSign = DB.prefs.lastSign || {};
  DB.prefs.lastSign[key] = obj;
}
/* ยังไม่เคยจำไว้ -> ไล่หาจากใบที่เคยเซ็นค้างไว้จริง ทุกฟอร์มที่มีช่องลงนามช่องนี้ (เอาใบล่าสุด) */
const SIG_SCANNED = {};
function scanLastSign(key){
  let hit = null;
  FORM_ORDER.forEach(fid=>{
    const f = FORMS[fid];
    if(!f || !f.footer.some(x=> x.type==="sign" && x.k===key)) return;
    const r = allRecs(fid).find(x=> x[key]);       /* allRecs เรียงใบใหม่สุดไว้บนแล้ว */
    if(!r) return;
    const newer = !hit || String(r.date||"") > String(hit.date||"")
      || (String(r.date||"") === String(hit.date||"") && (r.createdAt||0) > (hit.createdAt||0));
    if(newer) hit = r;
  });
  if(!hit) return null;
  return {img:hit[key], name:hit[key+"Name"] || "", pos:hit[key+"Pos"] || "",
          scale:Number(hit[key+"Scale"]) || 1, form:hit.formId, at:hit.updatedAt || hit.createdAt || 0};
}
/* ลายเซ็นที่ควรใช้กับช่องนี้: ลายเซ็นประจำของฟอร์ม -> ล่าสุดจากฟอร์มไหนก็ได้ -> คลังลายเซ็นตามชื่อ */
function signerFor(fid, key, name){
  const d = defaultSigner(fid, key);
  if(d && (d.img || d.name)) return d;
  let l = lastSignOf(key);
  if(!l && !SIG_SCANNED[key]){
    SIG_SCANNED[key] = 1;
    l = scanLastSign(key);
    if(l) rememberLastSign(key, l);
  }
  if(l && (l.img || l.name)) return l;
  const nm  = String(name||"").trim();
  const img = nm ? (DB.prefs.sigLib||{})[nm] : "";
  return img ? {img:img, name:nm, pos:(DB.prefs.signers||{})[nm] || ""} : null;
}
/* ตอนบันทึก: ช่องลายเซ็นที่ยังว่าง ให้ดึงลายเซ็นที่เคยเซ็นไว้ (ฟอร์มไหนก็ได้) มาใส่ */
function fillMissingSigners(f, r){
  const filled = [];
  f.footer.filter(x=> x.type==="sign").forEach(fd=>{
    if(r[fd.k]) return;
    const nm0 = String(r[fd.k+"Name"]||"").trim();
    const s = signerFor(f.id, fd.k, nm0);
    if(!s) return;
    const nm  = nm0 || s.name || "";
    const img = s.img || (nm ? (DB.prefs.sigLib||{})[nm] : "") || "";
    if(!img) return;
    r[fd.k] = img;
    if(!r[fd.k+"Name"]) r[fd.k+"Name"] = nm;
    if(!r[fd.k+"Pos"])  r[fd.k+"Pos"]  = s.pos || fd.pos || "";
    if(!r[fd.k+"Scale"] && s.scale) r[fd.k+"Scale"] = s.scale;
    filled.push(fd.label);
  });
  return filled;
}
/* จำลายเซ็นที่ใช้ในใบนี้ไว้ ให้ฟอร์มอื่นเรียกใช้ต่อ */
function keepSigners(f, r){
  f.footer.filter(x=> x.type==="sign").forEach(fd=>{
    if(!r[fd.k] && !r[fd.k+"Name"]) return;
    rememberLastSign(fd.k, {img:r[fd.k]||"", name:r[fd.k+"Name"]||"",
      pos:r[fd.k+"Pos"] || fd.pos || "", scale:Number(r[fd.k+"Scale"])||1, form:f.id, at:Date.now()});
  });
}
function applyDefaultSigners(f, r){
  f.footer.filter(x=> x.type==="sign").forEach(fd=>{
    const d = signerFor(f.id, fd.k, r[fd.k+"Name"]);
    if(!d) return;
    if(!r[fd.k] && d.img) r[fd.k] = d.img;
    if(!r[fd.k+"Name"] && d.name) r[fd.k+"Name"] = d.name;
    if(!r[fd.k+"Pos"] && d.pos) r[fd.k+"Pos"] = d.pos;
    if(!r[fd.k+"Scale"] && d.scale) r[fd.k+"Scale"] = d.scale;
  });
  return r;
}

/* ---------- ทะเบียนรถ -> ประเภทการจัดส่ง (เดาจากประวัติ + ทะเบียน AVL) ---------- */
let PLATE_TYPE = null;
function buildPlateType(){
  PLATE_TYPE = {};
  const cnt = {};
  allRecs("vehicle").forEach(r=>{
    const p = String(r.plate||"").trim(), d = r.delivery;
    if(!p || !d) return;
    (cnt[p] = cnt[p] || {})[d] = (cnt[p][d] || 0) + 1;
  });
  Object.keys(cnt).forEach(p=>{
    PLATE_TYPE[p] = Object.keys(cnt[p]).sort((a,b)=> cnt[p][b]-cnt[p][a])[0];
  });
  (MASTER.contractors||[]).forEach(c=>{
    const p = String(c.plate||"").trim();
    if(p && c.type && !PLATE_TYPE[p]) PLATE_TYPE[p] = c.type;
  });
}
function plateType(p){
  if(!PLATE_TYPE) buildPlateType();
  return PLATE_TYPE[String(p||"").trim()] || "";
}
function learnPlateType(p, t){
  if(!p || !t) return;
  if(!PLATE_TYPE) buildPlateType();
  PLATE_TYPE[String(p).trim()] = t;
}

function shareUrl(){

  if(PUBLIC_URL) return PUBLIC_URL + "/";
